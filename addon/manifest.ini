name = angelAudioKeeper
summary = "Angel Audio Keeper"
description = """Helps reduce sound-device wake delays and clipped speech by keeping one selected audio output active with continuous quiet noise. Includes adjustable volume, independent noise on all exposed stereo or surround channels, optional computer/display keep-awake, accessible settings and bounded local diagnostics. No microphone capture or networking. Initially disabled; hardware effectiveness varies. Settings: NVDA Preferences > Settings > Audio Keeper. Stop: NVDA+Shift+F12."""
author = "Angels Clan"
url = "https://github.com/AngelsClan/angel-audio-keeper"
version = 0.1.0
minimumNVDAVersion = 2026.1.0
lastTestedNVDAVersion = 2026.2.0
docFileName = readme.html
